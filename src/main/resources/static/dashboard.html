<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniCollege | Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        MiniCollege
    </div>

    <nav>

        <a href="/index.html">
            Home
        </a>

        <a href="/about.html">
            About
        </a>

        <a
            id="logoutLink"
            href="/login.html">
            Logout
        </a>

    </nav>

</header>


<main class="dashboard">

    <div class="dashboard-header">

        <p class="tag">
            STUDENT PORTAL
        </p>

        <h1 id="welcomeMessage">
            Welcome, Student! 👋
        </h1>

        <p>
            Here is your student information.
        </p>

    </div>


    <div class="student-grid">


        <div class="info-card">

            <div class="card-icon">
                👤
            </div>

            <h3>
                Student Name
            </h3>

            <p id="studentName">
                Rakesh
            </p>

        </div>


        <div class="info-card">

            <div class="card-icon">
                💻
            </div>

            <h3>
                Course
            </h3>

            <p id="course">
                Computer Science Engineering
            </p>

        </div>


        <div class="info-card">

            <div class="card-icon">
                🎓
            </div>

            <h3>
                Year
            </h3>

            <p id="year">
                3rd Year
            </p>

        </div>


        <div class="info-card">

            <div class="card-icon">
                🏫
            </div>

            <h3>
                College
            </h3>

            <p id="college">
                MiniCollege
            </p>

        </div>


    </div>


    <div class="dashboard-actions">

        <a href="/index.html">

            <button
                id="homeButton"
                class="secondary-btn">
                Back to Home
            </button>

        </a>

        <a href="/login.html">

            <button
                id="dashboardLogoutButton"
                class="primary-btn">
                Logout
            </button>

        </a>

    </div>

</main>


</body>

</html>
